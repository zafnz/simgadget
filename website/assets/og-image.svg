<!-- Source for the social card. Export to assets/og-image.png at 1200x630 —
     Open Graph consumers do not render SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="76%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#5fe3a1" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#5fe3a1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0c0d"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- tick rule -->
  <g stroke="#232a2d" stroke-width="1.5">
    <path d="M80 118h1040"/>
    <g>
      <path d="M80 118v-9M168 118v-9M256 118v-9M344 118v-9M432 118v-9M520 118v-9M608 118v-9M696 118v-9M784 118v-9M872 118v-9M960 118v-9M1048 118v-9M1120 118v-9"/>
    </g>
  </g>

  <!-- mark -->
  <g transform="translate(80 44) scale(2.1)" fill="none" stroke="#5fe3a1">
    <rect x="6.2" y="2.6" width="11.6" height="18.8" rx="2.9" stroke-width="1.7"/>
    <path d="M9.9 2.6h4.2" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="2.8" stroke-width="1.5"/>
    <path d="M12 7.5v1.4M12 15.1v1.4M7.6 12H9M15 12h1.4" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="136" y="80" fill="#e9eeee" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif"
        font-size="34" font-weight="600" letter-spacing="-1">SimGadget</text>

  <text x="80" y="248" fill="#e9eeee" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif"
        font-size="76" font-weight="650" letter-spacing="-3.2">Drive an iOS simulator</text>
  <text x="80" y="336" fill="#e9eeee" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif"
        font-size="76" font-weight="650" letter-spacing="-3.2">like you mean it.</text>

  <text x="80" y="412" fill="#9fadb0" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif"
        font-size="27">A TypeScript library, and an MCP server for AI agents.</text>
  <text x="80" y="452" fill="#9fadb0" font-family="-apple-system, BlinkMacSystemFont, Helvetica, sans-serif"
        font-size="27">No Python. No Homebrew. No four-year-old tooling.</text>

  <!-- command chips -->
  <g>
    <rect x="80" y="510" width="336" height="56" rx="12" fill="#121618" stroke="#232a2d" stroke-width="1.5"/>
    <text x="104" y="546" fill="#5fe3a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">$</text>
    <text x="126" y="546" fill="#e9eeee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">npm install simgadget</text>

    <rect x="440" y="510" width="330" height="56" rx="12" fill="#121618" stroke="#232a2d" stroke-width="1.5"/>
    <text x="464" y="546" fill="#5fe3a1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">$</text>
    <text x="486" y="546" fill="#e9eeee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">npx -y simgadget-mcp</text>
  </g>
</svg>
