name: Pages

# Publishes `website/` to https://simgadget.dev.
#
# GitHub Pages' branch deployment can only serve the repository root or
# `/docs`, and this site lives in neither -- so it is deployed as an artifact
# instead.
#
# The hand-written pages need no build; the API reference at /api/ does. It is
# generated from `packages/simgadget/src/index.ts` by TypeDoc into
# `website/api/`, which is gitignored -- so the docs on the site are always
# built from the commit being deployed and cannot drift from the source the way
# a committed build would. That is also why this workflow watches the library's
# sources: a doc comment changed with no change under `website/` still has to
# redeploy, and before the generate step existed that push published nothing.
#
# `website/CNAME` is part of the artifact on purpose. The custom domain is a
# repository setting, but Pages reads that file back out of every deployment,
# and a deployment without it can clear the domain.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      # The API reference is generated from these, so a change here changes the
      # published site even though nothing under website/ moved.
      - 'packages/simgadget/src/**'
      - 'docs/api-landing.md'
      - 'typedoc.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# Read the repo, mint the deployment's OIDC token, write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push supersedes an in-flight one, but
# is queued rather than cancelling it so a half-uploaded site never goes live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --force for the same reason ci.yml and publish.yml carry it: the
      # workspace still contains the deprecated `ios-multi-simulator-mcp`
      # wrapper, whose `os: darwin` makes a plain `npm ci` fail EBADPLATFORM on
      # a Linux runner. Nothing this job does needs macOS.
      - run: npm ci --force

      # `npm run docs` runs TypeDoc with --treatWarningsAsErrors, so a public
      # export that leaks a private type, or a dead {@link}, fails here rather
      # than shipping a broken reference. It writes into website/api/, which the
      # upload step below then picks up along with the rest of the site.
      - run: npm run docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
