name: CI

# Cheap checks on every push and pull request. Before this, nothing verified the
# repository at all: the build ran only as a side effect of publishing, so the
# first environment to notice a broken package was npm.
#
# Every step below is a workspace fan-out: the root package builds and publishes
# nothing, and `npm test` / `npm run typecheck` there run each package's own.
# A failing workspace fails the whole command, which is the property the fan-out
# depends on and is worth knowing is true rather than assuming.
#
# Ubuntu deliberately. None of these needs a simulator -- they are type checks,
# pure-logic tests, and a proof that the packed module graph resolves and the
# server answers -- and a macOS runner would cost 10x for no more signal.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Both packages' unit tests. `simgadget`'s pure logic -- pruning rules,
      # label matching, coordinate transforms -- and `simgadget-mcp`'s
      # rendering, sessions and tool wiring against a fake handle. No simulator,
      # no companion, seconds rather than the several minutes a simulator boot
      # costs to check the same rules.
      - name: Unit tests
        run: npm test

      # The check that 2.0.0 needed and did not have, now over both tarballs:
      # the server must resolve the library from a packed `simgadget`, not from
      # the workspace symlink it enjoys here.
      - name: Smoke test the packed packages
        run: npm run smoke
