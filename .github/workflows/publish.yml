# Reference: https://docs.npmjs.com/trusted-publishers
name: Publish Package to npm
on:
  release:
    types: [published]
jobs:
  build:
    # Only package releases. This repository also publishes `companion-*`
    # releases for the prebuilt idb_companion, which are keyed to the pinned idb
    # sha rather than to a package version -- there are several of them per
    # package version, and none of them is a thing to publish to npm. Without
    # this filter, bumping the idb submodule publishes the package.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      # `--force` for exactly one reason, the same as ci.yml's: the workspace
      # contains packages declaring `"os": ["darwin"]`, and npm refuses
      # EBADPLATFORM for a workspace package on a Linux runner — before
      # anything is built, tested or published. Nothing this workflow does
      # needs macOS. Missing here when ci.yml gained it, which is why the first
      # 3.0.1 release attempt failed at the first step.
      - run: npm ci --force

      - name: Unit tests
        run: npm test

      # Install the package the way a user does and start it, because the
      # repository is not a realistic environment: devDependencies are present
      # there, so a runtime import that is only a transitive devDependency
      # resolves locally and fails for everyone else.
      #
      # 2.0.0 shipped exactly that. The generated gRPC client imports
      # `@bufbuild/protobuf/wire`, which was reachable in the repo only through
      # ts-proto, a devDependency. Every check passed -- it built, it packed
      # with the right files, it ran from the working tree -- and the published
      # package could not start at all.
      #
      # Since 3.0.0 there are three packages, and the smoke covers all of them:
      # the server resolving the library from a *tarball* rather than the
      # workspace symlink is the way a split like this breaks for users and for
      # nobody else, and the wrapper's bin is what every existing client config
      # still invokes.
      - name: Smoke test the packed packages
        run: npm run smoke

      # Dependency order, and built first. `simgadget-mcp` has no `prepare`
      # script and cannot safely have one -- npm does not order workspace
      # lifecycle scripts by dependency, and its `tsc` needs the library's
      # declarations to exist (TODO #90) -- so the root's ordered `build` is
      # what guarantees both `build/` directories are current before anything
      # is packed. `npm run smoke` above already ran it; this is explicit so
      # that removing the smoke step never silently starts publishing stale
      # output.
      - name: Build, in dependency order
        run: npm run build

      - name: Publish simgadget
        run: npm publish --access public --workspace=simgadget

      # Second, because its dependency range (`simgadget@^3.0.0`) has to be
      # satisfiable on the registry the moment it lands, or the first person to
      # install it gets a package whose dependency does not exist yet.
      - name: Publish simgadget-mcp
        run: npm publish --access public --workspace=simgadget-mcp

      # Last, and usually a no-op. The wrapper exists only to keep old client
      # configs working, and it depends on `simgadget-mcp@^3.0.0` — so its
      # users get every 3.x release without it being republished. Republishing
      # it would be worse than pointless: `npm deprecate` marks *versions*, so
      # a fresh version arrives **undeprecated**, silently undoing the notice
      # that is the package's whole remaining purpose. It is therefore pinned
      # to the version that carries the notice, and this step publishes it only
      # if that version is somehow missing from the registry.
      - name: Publish the deprecated wrapper, only if it is not already there
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/ios-multi-simulator-mcp/package.json').version")"
          if npm view "ios-multi-simulator-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "ios-multi-simulator-mcp@${VERSION} is already published; leaving it, and its deprecation, alone."
          else
            npm publish --access public --workspace=ios-multi-simulator-mcp
            echo "::warning::Published a new wrapper version — re-run 'npm deprecate ios-multi-simulator-mcp' or it is no longer marked deprecated."
          fi
